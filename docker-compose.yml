services:
  db:
    image: postgres:16
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password

  web:
    build: .
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        yarn install &&
        yarn build:css &&
        bundle exec rails db:prepare &&
        bundle exec rails s -p 3000 -b '0.0.0.0'
      "

    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/tiny_honey_development
      RAILS_ENV: development

